<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clear Cache - Aditya Retail</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #B45309 0%, #92400E 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    h1 { color: #B45309; margin-bottom: 10px; font-size: 24px; }
    p { color: #666; margin-bottom: 20px; line-height: 1.6; }
    .status { 
      background: #f0f9ff; 
      border-radius: 8px; 
      padding: 15px; 
      margin: 20px 0;
      font-family: monospace;
      font-size: 14px;
      text-align: left;
      max-height: 200px;
      overflow-y: auto;
    }
    .status.success { background: #dcfce7; }
    .status.error { background: #fee2e2; }
    button {
      background: #B45309;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
      transition: background 0.3s;
    }
    button:hover { background: #92400E; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .secondary { background: #6b7280; }
    .secondary:hover { background: #4b5563; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Aditya Retail - App Reset</h1>
    <p>If your app is not working correctly or redirecting to the wrong site, click the button below to clear all cached data and fix the issue.</p>
    
    <div id="status" class="status">Ready to clear cache...</div>
    
    <button id="clearBtn" onclick="clearEverything()">Clear Cache & Fix App</button>
    <button class="secondary" onclick="goToApp()">Go to App</button>
  </div>

  <script>
    const statusDiv = document.getElementById('status');
    const clearBtn = document.getElementById('clearBtn');

    function log(message) {
      statusDiv.innerHTML += message + '<br>';
      statusDiv.scrollTop = statusDiv.scrollHeight;
    }

    async function clearEverything() {
      clearBtn.disabled = true;
      statusDiv.innerHTML = '';
      
      try {
        // 1. Clear all caches
        log('Clearing browser caches...');
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          log('Found ' + cacheNames.length + ' caches');
          for (const name of cacheNames) {
            await caches.delete(name);
            log('Deleted cache: ' + name);
          }
        }
        
        // 2. Unregister all service workers
        log('Unregistering service workers...');
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          log('Found ' + registrations.length + ' service workers');
          for (const registration of registrations) {
            await registration.unregister();
            log('Unregistered service worker');
          }
        }
        
        // 3. Clear localStorage
        log('Clearing local storage...');
        localStorage.clear();
        log('Local storage cleared');
        
        // 4. Clear sessionStorage
        log('Clearing session storage...');
        sessionStorage.clear();
        log('Session storage cleared');
        
        // 5. Clear IndexedDB (if any)
        log('Checking IndexedDB...');
        if ('indexedDB' in window && indexedDB.databases) {
          const databases = await indexedDB.databases();
          for (const db of databases) {
            indexedDB.deleteDatabase(db.name);
            log('Deleted database: ' + db.name);
          }
        }
        
        statusDiv.classList.add('success');
        log('');
        log('ALL DONE! Click Go to App to reinstall.');
        log('');
        log('After clicking, you can add the app to your home screen again.');
        
      } catch (error) {
        statusDiv.classList.add('error');
        log('Error: ' + error.message);
      }
      
      clearBtn.disabled = false;
    }

    function goToApp() {
      window.location.href = 'https://adityaretail.com';
    }
  </script>
</body>
</html>
