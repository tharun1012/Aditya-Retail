<!DOCTYPE html>
<html>
<head>
    <title>Clearing Cache...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #1a1a2e;
            color: white;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }
        h1 { font-size: 36px; margin-bottom: 20px; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status {
            margin: 20px 0;
            font-size: 18px;
        }
        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Clearing All Caches</h1>
        <div class="spinner"></div>
        <div class="status" id="status">Please wait...</div>
        <div id="result"></div>
    </div>

    <script>
        async function clearEverything() {
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            
            try {
                // 1. Unregister all service workers
                status.textContent = '1. Unregistering service workers...';
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                    }
                }
                
                // 2. Clear all caches
                status.textContent = '2. Clearing all caches...';
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (let name of cacheNames) {
                        await caches.delete(name);
                    }
                }
                
                // 3. Clear storage
                status.textContent = '3. Clearing storage...';
                localStorage.clear();
                sessionStorage.clear();
                
                // 4. Clear cookies
                status.textContent = '4. Clearing cookies...';
                document.cookie.split(";").forEach(c => {
                    document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
                });
                
                // Success
                status.textContent = '✅ All caches cleared!';
                result.innerHTML = `
                    <p style="color: #4CAF50; font-size: 20px; margin: 20px 0;">
                        Cache cleared successfully!
                    </p>
                    <p>Now redirecting to fresh site...</p>
                    <a href="/" class="button">Go to Site</a>
                `;
                
                // Auto redirect after 3 seconds
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
                
            } catch (error) {
                status.textContent = '❌ Error: ' + error.message;
                result.innerHTML = `
                    <p style="color: #f44336;">Please manually clear your browser cache</p>
                    <p>Then <a href="/" style="color: #4CAF50;">click here</a> to continue</p>
                `;
            }
        }
        
        // Start clearing on page load
        clearEverything();
    </script>
</body>
</html>
